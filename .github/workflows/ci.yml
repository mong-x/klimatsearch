name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: Install C toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc libc6-dev libsqlite3-dev
      - name: Test (self-hosted)
        run: CGO_ENABLED=1 go test -tags fts5 ./...
      - name: Test (hosted Guard)
        run: CGO_ENABLED=1 go test -tags "fts5 hosted" ./...
      - name: Build self-hosted
        run: CGO_ENABLED=1 go build -tags fts5 -o klimatsearch ./cmd/klimatsearch
      - uses: actions/upload-artifact@v4
        with:
          name: klimatsearch-linux-amd64
          path: klimatsearch
