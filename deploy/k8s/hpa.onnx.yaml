# HorizontalPodAutoscaler for deploy/k8s/deployment.onnx.yaml.
# Each replica needs its own SQLite (emptyDir + ingest on start).
# Do not HPA a Deployment that shares one klimatsearch-data PVC.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: klimatsearch
  labels:
    app: klimatsearch
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: klimatsearch
  minReplicas: 1
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 30
