apiVersion: apps/v1
kind: Deployment
metadata:
  name: klimatsearch
  labels:
    app: klimatsearch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: klimatsearch
  template:
    metadata:
      labels:
        app: klimatsearch
    spec:
      containers:
        - name: klimatsearch
          image: klimatsearch:e2e
          imagePullPolicy: Never
          args:
            - --embedder=fake
            - --demo-fixture
            - --ingest-on-start
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: KLIMAT_EMBEDDER
              value: fake
            - name: KLIMAT_LISTEN
              value: ":8080"
            - name: KLIMAT_DB
              value: /tmp/klimat.db
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 512Mi
